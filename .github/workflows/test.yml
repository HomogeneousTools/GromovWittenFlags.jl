name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12', '1']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1.6.0
      - name: Tests with bounds checking
        run: julia --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=yes"])'
      - name: Examples
        run: |
          julia --project=. examples/ProjectiveSpace.jl
          julia --project=. examples/ZeroLoci.jl
          julia --project=. examples/CertifiedQuantum.jl

  certified-parallel:
    name: Certified parallel workers and checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1.6.0
      - name: Tests with parallel certification enabled
        env:
          GWFLAGS_PARALLEL_TESTS: 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=yes"])'

  extended:
    name: Fourfold regressions
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1.6.0
      - name: Extended tests
        env:
          GWFLAGS_EXTENDED_TESTS: 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test(; julia_args=["--check-bounds=yes"])'

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.0.1
      - uses: julia-actions/setup-julia@v3.0.1
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - run: julia devtools/format.jl --check
